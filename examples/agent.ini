; ============================================================================
; PairLink agent 示例配置（服务提供者侧）
; ----------------------------------------------------------------------------
; agent 主动出站连接 relay 的 tunnel_listen，注册本机服务；不需要公网入站。
; 下面把 17080（演示 HTTP）、17081（TCP echo）、17082（UDP）映射出去，
; 请按实际本地服务改地址；目标服务没起来时配对会在数据面拨号失败，不影响 agent 运行。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：token 必须与 relay 的 auth_token 一致并替换占位符。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17091
pprof = false
log_level = info
log_format = text

[server]
; relay 的隧道地址（公网 relay 示例：relay.example.com:7000）。
relay_addr = 127.0.0.1:17000
; 接入密钥，必须与 relay 的 auth_token 完全一致；占位符必须替换。
token = CHANGE-ME-RELAY-AUTH-TOKEN
; 主服务协议：tcp / udp。主服务 ID 固定为 default。
protocol = tcp
; 主服务本地目标地址；裸端口会补 127.0.0.1。
local = 127.0.0.1:17080
; 可选：relay 使用自签/私有 CA 证书时指定 CA 文件；公网 CA 也可指向对应根证书。
; tls_ca = /etc/pairlink/tls/relay.crt
; 仅测试：跳过 relay 证书校验（生产禁用）。
; tls_insecure_skip_verify = false
; 控制面心跳间隔。
heartbeat = 30s
; 连接 relay 的超时。
dial_timeout = 10s
; agent 侧本地 UDP 会话空闲清理时间。
udp_session_timeout = 60s

; 附加服务：service.<ID> = <proto>:<host>:<port>，ID 只允许 a-z0-9-_（1..64）。
; 这些服务会出现在 relay 管理页与 client 的服务列表里。
service.echo = tcp:127.0.0.1:17081
service.demo-udp = udp:127.0.0.1:17082
