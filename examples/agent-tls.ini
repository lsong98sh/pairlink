; ============================================================================
; PairLink agent 示例配置（显式强制 TLS + 自签 CA）
; ----------------------------------------------------------------------------
; 与 agent.ini 的差异：tls = true，并用 tls_ca 指定 relay 的自签证书。
; 公网 CA 签发的 relay 证书：删除 tls_ca 这一行即可，tls = true 会用系统根证书
; 做标准校验（此时 relay_addr 的主机名必须与证书 SAN 匹配）。
; 自签证书生成命令见 examples/relay-tls.ini 顶部；把 relay.crt 拷到本机后
; 让下面的 tls_ca 指向它。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：token 必须与 relay 的 auth_token 一致并替换占位符。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17091
pprof = false
log_level = info
log_format = text

[server]
; relay 的隧道地址；公网部署时这里的 host 必须与 relay 证书 SAN 匹配。
relay_addr = relay.example.com:17000
; 接入密钥，必须与 relay 的 auth_token 完全一致；占位符必须替换。
token = CHANGE-ME-RELAY-AUTH-TOKEN
; 主服务协议：tcp / udp。主服务 ID 固定为 default。
protocol = tcp
; 主服务本地目标地址；裸端口会补 127.0.0.1。
local = 127.0.0.1:17080
; 显式 TLS 开关：auto（默认，按 CA/insecure 推断）| true（强制 TLS）| false（强制明文）。
tls = true
; 自签/私有 CA：只信任这张证书。公网 CA 场景请删除本行（改用系统根证书）。
tls_ca = /etc/pairlink/tls/relay.crt
; 控制面心跳间隔。
heartbeat = 30s
; 连接 relay 的超时。
dial_timeout = 10s
; agent 侧本地 UDP 会话空闲清理时间。
udp_session_timeout = 60s

; 附加服务：service.<ID> = <proto>:<host>:<port>。
service.echo = tcp:127.0.0.1:17081
