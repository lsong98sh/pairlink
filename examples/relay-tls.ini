; ============================================================================
; PairLink relay 示例配置（显式强制 TLS）
; ----------------------------------------------------------------------------
; 与 relay.ini 的差异：tls = true（强制 TLS），tls_cert / tls_key 必须成对非空。
; 自签证书生成（在 relay 机器执行，示例 SAN 请改成实际域名/IP）：
;   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
;     -keyout relay.key -out relay.crt -days 825 \
;     -subj "/CN=relay.example.com" \
;     -addext "subjectAltName=DNS:relay.example.com,IP:127.0.0.1"
; 生成后：relay.crt 即 tls_cert，relay.key 即 tls_key；证书权限建议 0644、私钥 0600。
; agent/client 的 tls_ca 指向同一张 relay.crt（自签证书自己就是 CA）。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17090
pprof = false
log_level = info
log_format = text

[relay]
; 隧道（控制面）监听地址，必填。
tunnel_listen = 0.0.0.0:17000
; TCP 数据面监听地址，必填。
tcp_listen = 0.0.0.0:17001
; 原生 UDP 数据面监听地址（留空则 UDP 走 tcp_listen 上的隧道）。
udp_listen = 0.0.0.0:17002
; 显式 TLS 开关：auto（默认，按证书推断）| true（强制 TLS）| false（强制明文）。
; true 时缺少任一证书路径会在启动校验阶段直接报错。
tls = true
; 强制 TLS 的证书与私钥，路径相对 ini 所在目录解析。
tls_cert = /etc/pairlink/tls/relay.crt
tls_key = /etc/pairlink/tls/relay.key
; 与 agent/client 的 token 保持一致；占位符必须替换。
auth_token = CHANGE-ME-RELAY-AUTH-TOKEN
pair_timeout = 10s
idle_timeout = 300s
heartbeat_timeout = 90s
udp_session_timeout = 60s
token_ttl = 15s
