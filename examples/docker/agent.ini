; ============================================================================
; PairLink agent —— docker compose 专用示例配置
; ----------------------------------------------------------------------------
; 与 ../../examples/agent.ini 的差异：
;   1) relay_addr 用 compose 服务名 relay:17000（容器内 127.0.0.1 不是 relay）；
;   2) 主服务 local 指向 compose 的 demo-http:80（一个 nginx 演示服务）；
;   3) 管理页绑 0.0.0.0，宿主机映射限制为 127.0.0.1。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; ============================================================================

[common]
manage_listen = 0.0.0.0:17091
pprof = false
log_level = info
log_format = json

[server]
; compose 网络内的 relay 服务名 + 容器端口。
relay_addr = relay:17000
; 必须与 relay.ini 的 auth_token 一致；占位符仅用于本地演示。
token = CHANGE-ME-RELAY-AUTH-TOKEN
protocol = tcp
; 演示用 nginx 容器；真实部署改成你的内网服务地址。
local = demo-http:80
; tls_ca = /etc/pairlink/tls/relay.crt
; tls_insecure_skip_verify = false
; 显式 TLS 开关：auto（默认，按证书/CA 推断）| true（强制 TLS）| false（强制明文）
tls = auto
heartbeat = 30s
; 原生 UDP 数据面的传输层加密（v0.5.0）：true（默认）走 DTLS 1.2 + PSK；
; false 退回明文（启动 WARN）。必须与 relay 的 udp_dtls 一致。
udp_dtls = true
dial_timeout = 10s
udp_session_timeout = 60s

; 需要注册更多服务时按同样格式追加（ID 只允许 a-z0-9-_）。
; service.echo = tcp:echo:7000
