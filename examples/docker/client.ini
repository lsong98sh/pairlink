; ============================================================================
; PairLink client —— docker compose 专用示例配置
; ----------------------------------------------------------------------------
; 与 ../../examples/client.ini 的差异：
;   1) relay_addr 用 compose 服务名 relay:17000；
;   2) 本地监听绑 0.0.0.0:18080（容器内 127.0.0.1 无法被宿主机端口映射访问），
;      宿主机映射限制为 127.0.0.1:18080；
;   3) 管理页绑 0.0.0.0，宿主机映射限制为 127.0.0.1。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; ============================================================================

[common]
manage_listen = 0.0.0.0:17092
pprof = false
log_level = info
log_format = json

[client]
relay_addr = relay:17000
; 必须与 relay.ini 的 auth_token 一致；占位符仅用于本地演示。
token = CHANGE-ME-RELAY-AUTH-TOKEN
; tls_ca = /etc/pairlink/tls/relay.crt
; tls_insecure_skip_verify = false
; 显式 TLS 开关：auto（默认，按证书/CA 推断）| true（强制 TLS）| false（强制明文）
tls = auto
subscribe = true
heartbeat = 30s
; 原生 UDP 数据面的传输层加密（v0.5.0）：true（默认）走 DTLS 1.2 + PSK；
; false 退回明文（启动 WARN）。必须与 relay 的 udp_dtls 一致。
udp_dtls = true
dial_timeout = 10s
pair_timeout = 10s
udp_session_timeout = 60s

; 把 agent 的主服务 default 映射到本机 18080；宿主机执行
;   curl http://127.0.0.1:18080/
; 即可看到 demo-http 的 nginx 欢迎页。
service.default = 0.0.0.0:18080
