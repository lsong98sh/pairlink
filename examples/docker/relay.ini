; ============================================================================
; PairLink relay —— docker compose 专用示例配置
; ----------------------------------------------------------------------------
; 与 ../../examples/relay.ini 的差异：
;   1) 管理页监听 0.0.0.0:17090（容器内必须绑 0.0.0.0，宿主机再用
;      deploy/docker-compose.yml 的 "127.0.0.1:17090:17090" 限制为仅本机可访问）；
;   2) 日志用 json，便于 docker logs / 日志驱动采集；
;   3) 隧道地址用 compose 的服务名 relay，供同网络内的 agent/client 连接。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：CHANGE-ME 占位 token 仅用于本地演示，任何可被外部访问的部署都必须替换。
; ============================================================================

[common]
; 容器内绑 0.0.0.0；宿主机端口映射限制为 127.0.0.1。
manage_listen = 0.0.0.0:17090
pprof = false
log_level = info
log_format = json

[relay]
tunnel_listen = 0.0.0.0:17000
tcp_listen = 0.0.0.0:17001
udp_listen = 0.0.0.0:17002
; 生产启用 TLS：把证书挂载进容器，并确保容器用户 uid 65532 可读（建议 0644）。
; 容器内路径可自由选择，注意与 compose 的 volumes 对应。
; tls_cert = /etc/pairlink/tls/relay.crt
; tls_key = /etc/pairlink/tls/relay.key
; 显式 TLS 开关：auto（默认，按证书/CA 推断）| true（强制 TLS）| false（强制明文）
; 本模板监听 0.0.0.0 且未配置证书：必须显式写 tls = false 才能通过校验（SEC-T2）。
; 公网部署请改为 tls = true 并配置 tls_cert / tls_key，不要把明文模板直接上线。
tls = false
; auth_token 为空时只允许回环来源接入（127.0.0.0/8、::1），非回环一律 auth_failed（SEC-A1）。
; 公网部署请替换为随机值：openssl rand -hex 32。
auth_token = CHANGE-ME-RELAY-AUTH-TOKEN
pair_timeout = 10s
idle_timeout = 300s
heartbeat_timeout = 90s
udp_session_timeout = 60s
token_ttl = 15s
