; ============================================================================
; PairLink relay 示例配置（原生 UDP 数据面）
; ----------------------------------------------------------------------------
; 适用：公网/内网中继服务器。所有端口都是高位端口，默认只用于本机演练；
;       生产请按实际网络改监听地址并放行防火墙/安全组。
; 语法：整行注释用 ';' 或 '#'；**不支持行尾注释**——值里出现的 ';'/'#' 会被当成值本身。
; 安全：auth_token 必须替换；公网必须配置 tls_cert/tls_key（见下方注释）。
; ============================================================================

[common]
; 管理页监听地址；为空表示不启动管理页。管理页无鉴权，务必只绑 127.0.0.1。
manage_listen = 127.0.0.1:17090
; 是否在管理端口挂载 /debug/pprof/；生产建议 false。
pprof = false
; 日志级别：debug / info / warn / error。
log_level = info
; 日志格式：text / json。交给 journald 时 text 更易读，采集到 ELK 时可用 json。
log_format = text

[relay]
; 隧道（控制面）监听地址，必填。agent/client 的 relay_addr 指向这里。
tunnel_listen = 0.0.0.0:17000
; TCP 数据面监听地址，必填。
tcp_listen = 0.0.0.0:17001
; 原生 UDP 数据面监听地址，可选。配置后 udp_mode = native；
; 删除/留空则 UDP 走 tcp_listen 上的封装隧道（udp_mode = tcp_tunnel，省一个公网端口但有队头阻塞）。
udp_listen = 0.0.0.0:17002
; TLS 证书/私钥：生产必须成对配置（公网明文隧道会被窃听/篡改）。
; 证书路径相对 ini 所在目录解析；服务模式下建议写绝对路径。
; 取消下面两行注释并替换为真实路径后重启 relay。
; tls_cert = /etc/pairlink/tls/relay.crt
; tls_key = /etc/pairlink/tls/relay.key
; agent/client 接入隧道使用的共享密钥。必须替换为随机长串（例如 openssl rand -hex 32），
; 且与 agent.ini / client.ini 的 token 完全一致。占位符不是可用密钥。
auth_token = CHANGE-ME-RELAY-AUTH-TOKEN
; 待配对表超时：配对键在 relay 上等待双方到齐的最长时间。
pair_timeout = 10s
; TCP 数据面空闲超时。
idle_timeout = 300s
; 控制面心跳判死超时。
heartbeat_timeout = 90s
; UDP 会话空闲超时。
udp_session_timeout = 60s
; 一次性配对令牌有效期（越短越安全，但要求两端时钟/网络延迟正常）。
token_ttl = 15s
