; ============================================================================
; PairLink client 示例配置（访问侧，TCP 服务）
; ----------------------------------------------------------------------------
; client 主动出站连接 relay，拉取服务列表，并在本机监听 service.<ID>；
; 第三方客户端连 127.0.0.1:18080/18081 即可，无需改造。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：token 必须与 relay 的 auth_token 一致并替换占位符。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17092
pprof = false
log_level = info
log_format = text

[client]
; relay 的隧道地址。
relay_addr = 127.0.0.1:17000
; 接入密钥，必须与 relay 的 auth_token 完全一致；占位符必须替换。
token = CHANGE-ME-RELAY-AUTH-TOKEN
; relay 使用自签/私有 CA 时指定；公网 CA 指向对应根证书。
; tls_ca = /etc/pairlink/tls/relay.crt
; 仅测试：跳过 relay 证书校验（生产禁用）。
; tls_insecure_skip_verify = false
; 显式 TLS 开关：auto（默认，按证书/CA 推断）| true（强制 TLS）| false（强制明文）
tls = auto
; 是否订阅 relay 的服务列表变更（默认 true）。
subscribe = true
; 控制面心跳间隔。
heartbeat = 30s
; 原生 UDP 数据面的传输层加密（v0.5.0）：true（默认）走 DTLS 1.2 + PSK；
; false 退回明文（启动 WARN）。必须与 relay 的 udp_dtls 一致。
udp_dtls = true
; 连接 relay 的超时。
dial_timeout = 10s
; 等待 relay 配对结果的超时。
pair_timeout = 10s
; client 侧本地 UDP 会话空闲清理时间（必须 > 0）。
udp_session_timeout = 60s

; 本地监听映射：service.<远端服务ID> = <本机 host:port>。
; 裸端口会补 127.0.0.1；要同网段访问请显式写 0.0.0.0:端口 并自行评估风险。
service.default = 127.0.0.1:18080
service.echo = 127.0.0.1:18081
