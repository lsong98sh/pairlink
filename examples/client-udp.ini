; ============================================================================
; PairLink client 示例配置（UDP 服务）
; ----------------------------------------------------------------------------
; 与 client.ini 的差异：只映射 agent 的 UDP 服务 demo-udp。
; 本文件对 relay.ini（原生 UDP）和 relay-no-udp.ini（UDP over TCP）都适用：
; relay 在握手响应里下发 udp_mode，client 自动选择承载方式，配置无需区分。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：token 必须与 relay 的 auth_token 一致并替换占位符。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17093
pprof = false
log_level = info
log_format = text

[client]
; relay 的隧道地址。
relay_addr = 127.0.0.1:17000
; 接入密钥，必须与 relay 的 auth_token 完全一致；占位符必须替换。
token = CHANGE-ME-RELAY-AUTH-TOKEN
; relay 使用自签/私有 CA 时指定。
; tls_ca = /etc/pairlink/tls/relay.crt
; 仅测试：跳过 relay 证书校验（生产禁用）。
; tls_insecure_skip_verify = false
subscribe = true
heartbeat = 30s
dial_timeout = 10s
pair_timeout = 10s
; UDP 本地会话空闲清理时间；生产可按业务调整，但必须 > 0。
udp_session_timeout = 60s

; 把 agent 的 UDP 服务 demo-udp 映射到本机 127.0.0.1:18082。
; UDP 是数据报语义：需要第三方客户端主动发包，且每个源地址/端口形成独立会话。
service.demo-udp = 127.0.0.1:18082
