; ============================================================================
; PairLink relay 示例配置（不监听原生 UDP，UDP 走 TCP 隧道）
; ----------------------------------------------------------------------------
; 与 relay.ini 的差异：**没有 udp_listen**。relay 启动时打印 WARN，并通过
; HelloOK / ServiceRegistered / ServiceList 的 udp_mode = tcp_tunnel 告知两端，
; agent/client 自动把 UDP 数据报封装进 tcp_listen 上的隧道帧。
; 取舍：省一个公网 UDP 端口，但多个 UDP 会话复用一条 TCP 连接，存在队头阻塞；
;       实时性敏感场景请改用 relay.ini 配置原生 udp_listen。
; 语法：整行注释用 ';' 或 '#'；不支持行尾注释。
; 安全：auth_token 必须替换；公网必须配置 tls_cert/tls_key。
; ============================================================================

[common]
; 管理页只绑本机；无鉴权，不要暴露到公网。
manage_listen = 127.0.0.1:17090
pprof = false
log_level = info
log_format = text

[relay]
; 隧道（控制面）监听地址，必填。
tunnel_listen = 0.0.0.0:17000
; TCP 数据面监听地址，必填；UDP over TCP 也复用这个端口。
tcp_listen = 0.0.0.0:17001
; 本文件故意不配置 udp_listen：udp_mode = tcp_tunnel。
; 需要原生 UDP 时删除本行注释并确保防火墙放行该 UDP 端口：
; udp_listen = 0.0.0.0:17002
; 生产必须配置 TLS（成对），否则隧道明文。
; tls_cert = /etc/pairlink/tls/relay.crt
; tls_key = /etc/pairlink/tls/relay.key
; 与 agent/client 的 token 保持一致；占位符必须替换。
auth_token = CHANGE-ME-RELAY-AUTH-TOKEN
pair_timeout = 10s
idle_timeout = 300s
heartbeat_timeout = 90s
udp_session_timeout = 60s
token_ttl = 15s
