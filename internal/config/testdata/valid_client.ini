; PairLink client（访问侧）模式示例
[common]
manage_listen = 127.0.0.1:9200
log_level     = warn

[client]
relay_addr = relay.example.com:7000
token      = s3cret-token
subscribe  = false
heartbeat  = 20s
dial_timeout = 3s
pair_timeout = 4s
service.http-svc = 127.0.0.1:8080
service.rdp-svc  = 127.0.0.1:13389
service.udp-svc  = 127.0.0.1:15000
