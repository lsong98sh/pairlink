# PairLink agent（服务提供者）模式示例
[common]
manage_listen = 127.0.0.1:9100

[server]
relay_addr = relay.example.com:7000
token      = s3cret-token
protocol   = tcp
local      = 127.0.0.1:8080
tls_ca     = ca.pem
heartbeat  = 15s
dial_timeout = 5s
udp_session_timeout = 45s
service.dsh = tcp:18080
service.web = udp:127.0.0.1:18081
