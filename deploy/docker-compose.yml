# PairLink 单机演示编排：relay + agent（转发 demo-http）+ client。
#
# 用法（在 deploy/ 目录）：
#   docker compose up -d
#   curl http://127.0.0.1:18080/          # 经 client 访问 agent 背后的 nginx
#   curl http://127.0.0.1:17090/          # relay 管理页
#   docker compose logs -f relay agent client
#   docker compose down
#
# 说明：
#   - 三个 PairLink 容器共用一个镜像（anchor x-pairlink），只读根文件系统、
#     丢弃全部 Linux capabilities，以 distroless 的 nonroot（uid 65532）运行。
#   - 配置从 examples/docker/*.ini **以目录方式挂载**：容器内 manage_listen 只能绑
#     0.0.0.0，按既有策略页面是只读的（写接口 403），当前不需要写回；保留目录挂载
#     是为了 `--network host` + manage_listen=127.0.0.1 这类可写场景（写回用
#     「临时文件 + rename」，单文件 :ro 挂载做不到）。根文件系统仍保持只读。
#   - 容器内 manage_listen 必须绑 0.0.0.0，再用下面的
#     "127.0.0.1:宿主端口:容器端口" 把管理页限制为仅本机访问。
#   - 只发布演示必需端口：三个管理页 + client 的 18080。
#     要让宿主机外的 agent/client 接入 relay，再放开 17000/17001/17002。
#   - v0.5.1 已在 WSL2 + Docker Engine 29.1.3 / Compose 2.40.3 实跑通过
#     （四容器 Up / 三管理页 200 / 18080 经隧道取到 nginx 首页），详见 deploy/README.md §5.4。

name: pairlink

x-pairlink: &pairlink
  image: pairlink:v0.5.1
  build:
    context: ..
    dockerfile: Dockerfile
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  stop_grace_period: 15s

services:
  relay:
    <<: *pairlink
    container_name: pairlink-relay
    command: ['-relay', '-config', '/etc/pairlink/relay.ini']
    volumes:
      # 目录挂载（只为可写场景保留；容器内页面只读，当前无需 chown）
      #   若用 --network host + 回环管理页，需先 sudo chown -R 65532:65532 examples/docker
      - ../examples/docker:/etc/pairlink:rw
      # 生产启用 TLS 时挂载证书，并确保容器用户 uid 65532 可读（建议 0644）：
      # - ../certs:/etc/pairlink/tls:ro
    ports:
      # 管理页：宿主机仅 127.0.0.1 可访问（容器内监听 0.0.0.0）。
      - '127.0.0.1:17090:17090'
      # 需要让容器外的 agent/client 接入时再放开：
      # - '17000:17000'      # 隧道（控制面）
      # - '17001:17001'      # TCP 数据面
      # - '17002:17002/udp'  # 原生 UDP 数据面（可选）

  demo-http:
    image: nginx:1.27-alpine
    container_name: pairlink-demo-http
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  agent:
    <<: *pairlink
    container_name: pairlink-agent
    command: ['-agent', '-config', '/etc/pairlink/agent.ini']
    volumes:
      # 同上：目录挂载（可写场景才需要，容器内页面只读）
      - ../examples/docker:/etc/pairlink:rw
    ports:
      - '127.0.0.1:17091:17091'
    depends_on:
      - relay
      - demo-http

  client:
    <<: *pairlink
    container_name: pairlink-client
    command: ['-client', '-config', '/etc/pairlink/client.ini']
    volumes:
      # 同上：目录挂载（可写场景才需要，容器内页面只读）
      - ../examples/docker:/etc/pairlink:rw
    ports:
      # 管理页
      - '127.0.0.1:17092:17092'
      # 第三方客户端访问入口：curl http://127.0.0.1:18080/
      - '127.0.0.1:18080:18080'
    depends_on:
      - relay
      - agent
